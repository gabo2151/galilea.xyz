<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galilea</title>
    <meta name="description" content="Galilea">
    <!-- Keep the site out of search results; no robots.txt block, so
         AdMob can still read app-ads.txt. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="css/site.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Shown before Vue mounts, or without JavaScript; Vue replaces it.
           Keep the title in sync with js/domain/site.js. -->
      <main class="stage">
        <h1 class="site-title" data-text="GALILEA">GALILEA</h1>
      </main>
    </div>
  </body>
</html>
