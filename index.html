<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galilea</title>
    <meta name="description" content="Galilea">
    <!-- Keep the site out of search results; no robots.txt block, so
         AdMob can still read app-ads.txt. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #1f2124;
        color: #c0c0c0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 12vw, 7rem);
        font-weight: 300;
        letter-spacing: 0.3em;
        /* The letter spacing also follows the last letter: shift it back
           so the word sits truly centred. */
        margin-right: -0.3em;
      }
    </style>
  </head>
  <body>
    <h1>GALILEA</h1>
  </body>
</html>
